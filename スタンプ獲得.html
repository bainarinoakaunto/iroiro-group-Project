<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スタンプ取得 | なんでも会社</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="いろいろ.png">

<style>
  
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at center,#fff3e6,#ffd8b0);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  overflow:hidden;
  color:#5a3b1e;
}
.card{
  background:white;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
  max-width:400px;
  width:90%;
  position:relative;
  z-index:2;
}
h1{margin:0;}
.stamp-icon{
  font-size:80px;
  margin:20px 0;
  opacity:0;
  transform:scale(0.3) rotate(-180deg);
}
.status{
  font-size:18px;
  margin-top:10px;
  font-weight:bold;
}
.success{ color:#27ae60; }
.already{ color:#c0392b; }
.countdown{
  margin-top:15px;
  font-size:14px;
  color:#888;
}
input{
  margin-top:10px;
  padding:8px;
  border-radius:6px;
  border:1px solid #c59f7b;
}
button{
  margin-top:8px;
  padding:6px 14px;
  border-radius:6px;
  border:none;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}
button:hover{opacity:0.8;}

@keyframes popStamp{
  0%{opacity:0; transform:scale(0.3) rotate(-180deg);}
  60%{transform:scale(1.3) rotate(10deg);}
  100%{opacity:1; transform:scale(1) rotate(0);}
}
.sparkle{
  position:absolute;
  font-size:20px;
  animation:fall 3s linear infinite;
  opacity:0.8;
}
@keyframes fall{
  0%{transform:translateY(-100px) rotate(0deg);}
  100%{transform:translateY(100vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="card">
  <h1>🎉 スタンプ取得</h1>

  <div id="passwordArea" style="display:none;">
    <input type="password" id="passwordInput" placeholder="パスワードを入力">
    <br>
    <button onclick="checkPassword()">送信</button>
  </div>

  <div class="stamp-icon" id="stampIcon">🎫</div>
  <p class="status" id="message">QRを確認中...</p>
  <div class="countdown" id="countdown"></div>
</div>

<script>


/* ===== 設定 ===== */
const STAMP_ID="自動UI";
const STAMP_IMG="https://bainarinoakaunto.github.io/iroiro-group-Project/%E3%81%84%E3%82%8D%E3%81%84%E3%82%8D.png";
const REDIRECT_URL="デジタルスタンプカード.html";
const PASSWORD="111";

/* ===== 要素 ===== */
const message=document.getElementById("message");
const stampIcon=document.getElementById("stampIcon");
const countdownEl=document.getElementById("countdown");

/* ===== 日本時間（安定版） ===== */
function todayKey(){
  const now = new Date();
  const jp = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));

  const yyyy = jp.getFullYear();
  const mm = String(jp.getMonth()+1).padStart(2,"0");
  const dd = String(jp.getDate()).padStart(2,"0");

  return `${yyyy}-${mm}-${dd}`;
}

/* ===== URLキー ===== */
const urlParams = new URLSearchParams(location.search);
const key = (urlParams.get("key") || "").trim();

/* ===== 平日判定 ===== */
function isWeekday(){
  const d = new Date();
  return d.getDay() >= 1 && d.getDay() <= 5;
}

/* ===== 表示日付 ===== */
function todayDisplay(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

/* ===== スタンプ追加（無制限） ===== */
function startStampProcess(){

  let stamps = JSON.parse(localStorage.getItem("stamps") || "[]");

  stamps.push({
    img: STAMP_IMG,
    number: STAMP_ID,
    date: todayDisplay(),
    used: false
  });

  localStorage.setItem("stamps", JSON.stringify(stamps));

  message.textContent = "🎉 スタンプを1個獲得しました！";
  message.className = "status success";

  stampIcon.style.animation = "popStamp 1s forwards";

  let seconds = 5;
  countdownEl.textContent = `${seconds}秒後に移動します...`;

  const timer = setInterval(()=>{
    seconds--;
    countdownEl.textContent = `${seconds}秒後に移動します...`;

    if(seconds <= 0){
      clearInterval(timer);
      location.href = REDIRECT_URL;
    }
  },1000);
}

/* ===== 読み込み時（完全修正版） ===== */
window.onload = function(){

  const VALID_KEY = ("stamp-" + todayKey()).trim();

  // ★デバッグ（ここ超重要）
  console.log("KEY:", key);
  console.log("VALID:", VALID_KEY);

  if(!key){
    message.textContent = "⚠️ keyなし";
    return;
  }

  if(key !== VALID_KEY){
    message.textContent = "⚠️ 読み込みエラー（キー不一致）";
    return;
  }

  // ★平日でも制限なし（必要ならここで変更）
  document.getElementById("passwordArea").style.display = "none";

  startStampProcess();
};

</script>

</body>
</html>
