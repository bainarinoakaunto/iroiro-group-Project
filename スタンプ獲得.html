<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スタンプ取得 | いろいろGroup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fdf2e9,#ffe0c7);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  color:#5a3b1e;
}

.card{
  background:white;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  max-width:400px;
  width:90%;
  animation:fadeIn 0.8s ease;
}

h1{
  margin-top:0;
  font-size:24px;
}

.stamp-icon{
  font-size:60px;
  margin:20px 0;
  animation:pop 1s infinite alternate;
}

.status{
  font-size:16px;
  margin-top:10px;
}

.success{ color:#27ae60; font-weight:bold; }
.already{ color:#c0392b; font-weight:bold; }

/* ホームボタン */
.home-btn{
  display:inline-block;
  margin-top:25px;
  padding:10px 20px;
  border-radius:30px;
  background:#b3561c;
  color:white;
  font-weight:bold;
  text-decoration:none;
  transition:0.3s;
}

.home-btn:hover{
  background:#8b4513;
  transform:translateY(-2px);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes pop{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}
</style>
</head>

<body>

<div class="card">
  <h1>🎉 ご来場ありがとうございます！</h1>
  <div class="stamp-icon">🎫</div>
  <p class="status" id="message">スタンプを確認中...</p>

  <!-- ホームボタン -->
  <a href="index.html" class="home-btn">🏠 ホームへ戻る</a>
</div>

<script>
/* ===== 設定 ===== */
const STAMP_ID = "001";
const REDIRECT_URL = "デジタルスタンプカード.html";

function todayKey(){
  return new Date().toISOString().slice(0,10);
}

const keyName = "stampDate_" + STAMP_ID;
const message = document.getElementById("message");

if(localStorage.getItem(keyName) !== todayKey()){
  localStorage.setItem(keyName, todayKey());
  message.textContent = "スタンプを取得しました！デジスタへ移動します...";
  message.className = "status success";

  setTimeout(()=>{
    location.href = REDIRECT_URL + "?stamp=" + STAMP_ID;
  },1500);

}else{
  message.textContent = "今日はすでに取得済みです。デジスタへ戻ります...";
  message.className = "status already";

  setTimeout(()=>{
    location.href = REDIRECT_URL;
  },1500);
}
</script>

</body>
</html>
