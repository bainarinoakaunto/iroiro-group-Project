<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スタンプ取得 | いろいろGroup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at center,#fff3e6,#ffd8b0);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  overflow:hidden;
  color:#5a3b1e;
}

.card{
  background:white;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
  max-width:400px;
  width:90%;
  position:relative;
  z-index:2;
}

h1{margin:0;}

.stamp-icon{
  font-size:80px;
  margin:20px 0;
  opacity:0;
  transform:scale(0.3) rotate(-180deg);
}

.status{
  font-size:18px;
  margin-top:10px;
  font-weight:bold;
}

.success{ color:#27ae60; }
.already{ color:#c0392b; }

/* キラキラ */
.sparkle{
  position:absolute;
  font-size:20px;
  animation:fall 3s linear infinite;
  opacity:0.8;
}

@keyframes fall{
  0%{transform:translateY(-100px) rotate(0deg);}
  100%{transform:translateY(100vh) rotate(360deg);}
}

@keyframes popStamp{
  0%{opacity:0; transform:scale(0.3) rotate(-180deg);}
  60%{transform:scale(1.3) rotate(10deg);}
  100%{opacity:1; transform:scale(1) rotate(0);}
}

.countdown{
  margin-top:15px;
  font-size:14px;
  color:#888;
}

input{
  margin-top:15px;
  padding:8px;
  width:80%;
  border-radius:6px;
  border:1px solid #c59f7b;
  font-size:16px;
}

button{
  margin-top:10px;
  padding:8px 16px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #c59f7b;
  background:#fff2e0;
  cursor:pointer;
}

button:hover{
  background:#ffd8b0;
}
</style>
</head>

<body>

<div class="card">
  <h1>🎉 スタンプ取得</h1>
  <div id="passwordArea">
    <input type="password" id="passwordInput" placeholder="パスワードを入力">
    <br>
    <button onclick="checkPassword()">送信</button>
  </div>

  <div class="stamp-icon" id="stampIcon">🎫</div>
  <p class="status" id="message">パスワードを入力してください</p>
  <div class="countdown" id="countdown"></div>
</div>

<script>
/* ===== 設定 ===== */
const PASSWORD="irosuta"; // パスワード設定
const STAMP_ID="いろスタ";
const STAMP_IMG="https://cdn2.scratch.mit.edu/get_image/project/1264832201_100x80.png";
const REDIRECT_URL="デジタルスタンプカード.html";

/* ===== 日付 ===== */
function today(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}
function todayKey(){
  return new Date().toISOString().slice(0,10);
}

/* ===== 要素取得 ===== */
const message=document.getElementById("message");
const stampIcon=document.getElementById("stampIcon");
const countdownEl=document.getElementById("countdown");
const dateKey="stampDate_"+STAMP_ID;
const passwordInput=document.getElementById("passwordInput");
const passwordArea=document.getElementById("passwordArea");

/* ===== パスワードチェック ===== */
function checkPassword(){
  const input=passwordInput.value.trim();
  if(input===PASSWORD){
    passwordArea.style.display="none"; // パスワード欄を非表示
    startStampProcess();
  }else{
    message.textContent="パスワードが違います";
    message.className="status already";
  }
}

/* ===== スタンプ取得処理 ===== */
function startStampProcess(){
  if(localStorage.getItem(dateKey)!==todayKey()){

    let stamps=JSON.parse(localStorage.getItem("stamps")||"[]");

    stamps.push({
      img:STAMP_IMG,
      number:STAMP_ID,
      date:today(),
      used:false
    });

    localStorage.setItem("stamps",JSON.stringify(stamps));
    localStorage.setItem(dateKey,todayKey());

    message.textContent="スタンプを1個獲得しました！";
    message.className="status success";

    /* スタンプアニメ */
    stampIcon.style.animation="popStamp 1s forwards";

    /* キラキラ生成 */
    for(let i=0;i<20;i++){
      const s=document.createElement("div");
      s.textContent="✨";
      s.className="sparkle";
      s.style.left=Math.random()*100+"%";
      s.style.animationDuration=(2+Math.random()*2)+"s";
      document.body.appendChild(s);
    }

    /* 5秒カウントダウン */
    let seconds=5;
    countdownEl.textContent=`${seconds}秒後にデジスタへ移動します...`;

    const timer=setInterval(()=>{
      seconds--;
      countdownEl.textContent=`${seconds}秒後にデジスタへ移動します...`;
      if(seconds<=0){
        clearInterval(timer);
        location.href=REDIRECT_URL;
      }
    },1000);

  }else{
    message.textContent="今日はすでに取得済みです。";
    message.className="status already";
    stampIcon.textContent="✅";

    setTimeout(()=>{
      location.href=REDIRECT_URL;
    },3000);
  }
}
</script>

</body>
</html>
