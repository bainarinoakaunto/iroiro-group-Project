<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株シミュレーター登録ページ</title>
<style>
body{margin:0; padding:0; height:100vh;}
iframe{width:100%; height:100%; border:none;}
</style>
</head>
<body>

<iframe id="formFrame" src="https://docs.google.com/forms/d/e/1FAIpQLSdrS7n7m3V5IF8AB0vClyOwMiggU5iSKD4Mq7Z6io86a9yNYA/viewform?usp=pp_url"></iframe>

<script>
// Googleフォーム送信後は thank you ページにリダイレクトされるので、
// tourokku.html 側で「戻るボタン」を押した時や「リロード時」に登録完了扱いにする
if(!localStorage.getItem("isRegistered")){
  localStorage.setItem("isRegistered","true");
}

// オプション：フォーム送信後に株シミュレーターに自動遷移
document.getElementById("formFrame").onload = function(){
  // フォーム送信完了ページを検知してリダイレクトも可能
  let url = this.contentWindow.location.href;
  if(url.includes("formResponse")){ // Googleフォーム送信完了ページ
    window.location.href = "株シミュレーターのURL"; 
  }
}
</script>

</body>
</html>
