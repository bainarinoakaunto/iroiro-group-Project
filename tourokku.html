<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>サポートフォーム</title>

<style>
body{
font-family:sans-serif;
text-align:center;
margin:20px;
}

iframe{
width:100%;
height:750px;
border:none;
}
</style>

</head>
<body>

<h2>サポートフォーム</h2>

<iframe id="form"></iframe>

<script>

// 保存された番号
let num = localStorage.getItem("supportNumber");

// なければ4桁生成
if(!num){
num = Math.floor(1000 + Math.random()*9000);
localStorage.setItem("supportNumber", num);
}

// フォームURL
let url="https://docs.google.com/forms/d/e/1FAIpQLSdrS7n7m3V5IF8AB0vClyOwMiggU5iSKD4Mq7Z6io86a9yNYA/viewform?usp=pp_url&entry.1672909628="+num;

// iframeに読み込み
document.getElementById("form").src=url;

</script>

</body>
</html>
