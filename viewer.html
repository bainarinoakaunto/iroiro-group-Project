<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mi!- TV表示</title>
<style>
/* ビューポート全体を黒背景に */
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
}

/* 画像は縦横比を維持して表示 */
#screen {
  width:100%;
  height:100%;
  object-fit:contain;  /* 縦横比を維持 */
  display:block;
  background:black;   /* 余白を黒で埋める */
}
</style>
</head>
<body>

<img id="screen">

<script>
// BroadcastChannelでリアルタイム受信
const img = document.getElementById("screen");
const channel = new BroadcastChannel("tv-share");

channel.onmessage = e => {
  img.src = URL.createObjectURL(e.data);
};

// 受信した画像をウィンドウサイズに合わせる
img.onload = () => {
  // 画像の縦横比を維持しながらウィンドウサイズに合わせる
  const windowWidth = window.innerWidth;
  const windowHeight = window.innerHeight;

  const imgAspectRatio = img.naturalWidth / img.naturalHeight;
  const windowAspectRatio = windowWidth / windowHeight;

  if (imgAspectRatio > windowAspectRatio) {
    // 画像が横長の場合
    img.style.width = '100%';
    img.style.height = 'auto';
  } else {
    // 画像が縦長または正方形の場合
    img.style.height = '100%';
    img.style.width = 'auto';
  }
};

// フルスクリーン化（ユーザー操作で必須）
function fullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

// ページロード時とクリック時にフルスクリーン
window.onload = fullscreen;
document.addEventListener("click", fullscreen);
</script>
</body>
</html>
