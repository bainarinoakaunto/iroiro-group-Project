<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini OBS - TV表示</title>
<style>
/* ビューポート全体を黒背景に */
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
}

/* 画像は縦横比を維持して表示 */
#screen {
  width:100%;
  height:100%;
  object-fit:contain; /* 縦横比維持 */
  display:block;
  background:black;   /* 余白を黒で埋める */
}
</style>
</head>
<body>

<img id="screen">

<script>
// BroadcastChannelでリアルタイム受信
const img = document.getElementById("screen");
const channel = new BroadcastChannel("tv-share");

channel.onmessage = e => {
  img.src = URL.createObjectURL(e.data);
};

// フルスクリーン化（ユーザー操作で必須）
function fullscreen() {
  if(!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

// ページロード時とクリック時にフルスクリーン
window.onload = fullscreen;
document.addEventListener("click", fullscreen);
</script>
</body>
</html>
