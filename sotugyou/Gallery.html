<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>なんでも会社 | 卒業通信ギャラリー</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:"Arial",sans-serif;
background:#ffe6e6;
color:#333;
text-align:center;
overflow-x:hidden;
padding-bottom:120px;
}

/* ヘッダー */

header{
padding:40px 20px;
background:#ff9999;
color:white;
}

header h1{
margin:0;
}

/* セクション */

section{
padding:30px 15px;
}

h2{
color:#ff3366;
}

/* ギャラリー */

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.gallery img{
max-width:100%;
height:auto;
border-radius:12px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.2s;
}

.gallery img:hover{
transform:scale(1.03);
}

/* モーダル */

#modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

#modal img{
max-width:95%;
max-height:95%;
border-radius:10px;
}

/* 桜 */

.sakura{
position:fixed;
width:12px;
height:12px;
background:pink;
border-radius:50%;
pointer-events:none;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-50px) rotate(0);}
100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}

/* 下固定リンク */

.link-bar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
border-top:3px solid #ff3366;
padding:10px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
z-index:999;
}

.link-card{
padding:12px 16px;
background:#ff3366;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,0.25);
}

.link-card:hover{
background:#ff6699;
}

/* スマホ */

@media(max-width:600px){

.gallery{
flex-direction:column;
align-items:center;
}

.gallery img{
width:90%;
}

}

</style>
</head>

<body>

<header>
<h1>🎓 なんでも会社 卒業通信ギャラリー</h1>
<p>いろいろ会社・何でも会社制作のWeb作品</p>
</header>

<section>

<h2>📷 思い出ギャラリー</h2>

<img src="https://bainarinoakaunto.github.io/iroiro-group-Project/%E3%81%AA%E3%82%93%E3%81%A7%E3%82%82.png" onclick="openModal(this)">

<script>

function openModal(img){

const modal=document.getElementById("modal");
modal.style.display="flex";
modal.querySelector("img").src=img.src;

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

function createSakura(){

const s=document.createElement("div");
s.className="sakura";

s.style.left=Math.random()*window.innerWidth+"px";
s.style.width=s.style.height=(8+Math.random()*10)+"px";
s.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(s);

setTimeout(()=>s.remove(),8000);

}

setInterval(createSakura,300);

</script>
