<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>なんでも会社 卒業アルバム</title>

<style>

body{
margin:0;
font-family:"Arial",sans-serif;
background:#fff5f7;
text-align:center;
color:#333;
overflow-x:hidden;
}

/* ヘッダー */

header{
background:linear-gradient(135deg,#ff9fb3,#ff6b8a);
color:white;
padding:50px 20px;
}

header h1{
margin:0;
font-size:2.5em;
}

header p{
margin-top:10px;
}

/* セクション */

section{
padding:40px 20px;
}

h2{
color:#ff4d73;
margin-bottom:30px;
}

/* アルバム */

.gallery{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:25px;

max-width:1100px;

margin:auto;

}

.photo-card{

background:white;

border-radius:15px;

padding:10px;

box-shadow:0 10px 25px rgba(0,0,0,0.15);

transition:0.3s;

}

.photo-card:hover{

transform:translateY(-5px);

}

.photo-card img{

width:100%;

border-radius:10px;

cursor:pointer;

}

.caption{

margin-top:8px;

font-size:14px;

color:#666;

}

/* リンクカード */

.link-area{

max-width:800px;

margin:auto;

}

.link-card{

display:block;

margin:15px;

padding:18px;

background:#ff4d73;

color:white;

text-decoration:none;

border-radius:12px;

font-weight:bold;

transition:0.2s;

}

.link-card:hover{

background:#ff6f92;

transform:scale(1.03);

}

/* モーダル */

#modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,0.8);

justify-content:center;

align-items:center;

z-index:1000;

}

#modal img{

max-width:90%;

max-height:90%;

border-radius:10px;

}

/* 桜 */

.sakura{

position:fixed;

width:12px;

height:12px;

background:pink;

border-radius:50%;

pointer-events:none;

animation:fall linear infinite;

}

@keyframes fall{

0%{transform:translateY(-50px) rotate(0)}

100%{transform:translateY(100vh) rotate(360deg);opacity:0}

}

/* フッター */

footer{

background:#ff9fb3;

color:white;

padding:20px;

margin-top:40px;

}

/* スマホ */

@media(max-width:600px){

header h1{

font-size:1.8em;

}

.gallery{

grid-template-columns:1fr 1fr;

}

}

</style>
</head>

<body>

<header>

<h1>🎓 なんでも会社 卒業アルバム</h1>

<p>思い出の写真とプロジェクト</p>

<section>

</div>

<div class="photo-card">

</div>

<div id="modal" onclick="closeModal()">

<img src="">

</div>

<footer>


</footer>

<script>

/* モーダル */

function openModal(img){

const modal=document.getElementById("modal");

modal.style.display="flex";

modal.querySelector("img").src=img.src;

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

/* 桜 */

function sakura(){

const s=document.createElement("div");

s.className="sakura";

s.style.left=Math.random()*window.innerWidth+"px";

s.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(s);

setTimeout(()=>s.remove(),8000);

}

setInterval(sakura,300);

</script>

</body>
</html>
