<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>いろいろページ | いろいろgroup</title>

  <style>
    body {
      display: none;
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f5f6fa;
      color: #333;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: #ecf0f1;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    article {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    article h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>

  <script>
    const password = "89281";
    const input = prompt("パスワードを入力してください");

    if (input === password) {
      document.addEventListener("DOMContentLoaded", function () {
        document.body.style.display = "block";
      });
    } else {
      alert("パスワードが違います");
    }
  </script>
</head>

<body>

<header>
  <h1>いろいろページ</h1>
  <p>日々のいろいろを書いています</p>
  <nav>
    <a href="index.html">ホームページトップ</a>
   
  </nav>
</header>

<main>
  <article>
    <h3>現在、ありません</h3>
    <p>ただいま準備中です。</p>
  </article>
</main>

<footer>
  <p>2026 いろいろgroup</p>
</footer>

</body>
</html>
