<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>いろいろページ | いろいろgroup</title>

  <style>
    body {
      display: none;
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f5f6fa;
      color: #333;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    article {
      background: white;
      padding: 25px;
      border-radius: 10px;
    }
  </style>

  <script>
    const PASSWORD = "89281";

    // すでにログイン済みか？
    if (localStorage.getItem("loginOK") === "true") {
      document.addEventListener("DOMContentLoaded", () => {
        document.body.style.display = "block";
      });
    } else {
      const input = prompt("パスワードを入力してください");

      if (input === PASSWORD) {
        // ログイン情報を保存
        localStorage.setItem("loginOK", "true");

        document.addEventListener("DOMContentLoaded", () => {
          document.body.style.display = "block";
        });
      } else {
        alert("パスワードが違います");

        // 前のページへ
        if (history.length > 1) {
          history.back();
        } else {
          location.href = "index.html";
        }
      }
    }
  </script>
</head>

<body>

<header>
  <h1>いろいろページ</h1>
</header>

<main>
  <article>
    <h3>準備中</h3>
    <p></p>
  </article>
</main>

</body>
</html>
