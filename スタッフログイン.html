<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スタッフログイン</title>

<link rel="icon" type="image/png" href="いろいろ.png">

<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-image:url("https://bainarinoakaunto.github.io/iroiro-group-Project/%EF%BD%9A.png");
  background-size:cover;
  background-position:center;
}
.login-box{
  background:rgba(255,255,255,0.95);
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  width:320px;
  text-align:center;
}
input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#b3561c;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover{
  background:#8b4513;
}
#message{
  color:red;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>スタッフログイン</h2>

  <input type="text" id="id" placeholder="スタッフID">
  <input type="password" id="pass" placeholder="パスワード">

  <button onclick="login()">ログイン</button>

  <p id="message"></p>
</div>

<script>
function login(){
  const id = document.getElementById("id").value;
  const pass = document.getElementById("pass").value;

  // 🔑 認証情報（必要に応じて変更）
  if(id === "1340" && pass === "0000"){
    sessionStorage.setItem("auth","ok");
    window.location.href = "専用ページ.html";
  }else{
    document.getElementById("message").textContent = "IDまたはパスワードが違います";
  }
}
</script>

</body>
</html>
