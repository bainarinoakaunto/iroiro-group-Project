<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スタッフ専用ページ</title>
<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding:40px;
  background:#fdf2e9;
}
button{
  margin-top:20px;
  padding:10px 20px;
  font-size:16px;
}
#stampCount{
  font-size:20px;
  font-weight:bold;
  margin-top:30px;
  color:#b3561c;
}
</style>

<script>
// 🔐 ログインチェック
if(sessionStorage.getItem("auth") !== "ok"){
  alert("スタッフログインを通ってください");
  location.href = "スタッフログイン.html";
}
</script>
</head>

<body>

<h1>🎫 スタッフ専用ページ</h1>

<button onclick="manualStamp()">🎫 スタンプを押す</button>

<!-- 個別スタンプ表示を削除 -->
<p id="stampCount">合計スタンプ数: 0</p>

<script>
// 個別スタンプは非表示にして合計だけ管理
let stampCount = parseInt(localStorage.getItem("stampCount") || "0");

// 合計スタンプ表示を更新
function render(){
  document.getElementById("stampCount").textContent = "合計スタンプ数: " + stampCount;
}

// スタンプ追加
function manualStamp(){
  stampCount += 1;
  localStorage.setItem("stampCount", stampCount);
  render();
  alert("スタンプを追加しました！");
}

render();
</script>

</body>
</html>
