<!DOCTYPE html>

<style>
/* ===== 基本デザイン ===== */
body{
  font-family:"Comic Sans MS",sans-serif;
  text-align:center;
  padding:20px;
  background:#fdf2e9;
}
#reader{
  width:300px;margin:20px auto;
  border:3px dashed #c59f7b;border-radius:12px;
  padding:10px;background:#fff8f0;
}
.stamp-area{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:15px;margin-top:20px;
}
.stamp{
  border:2px dashed #c59f7b;padding:5px;width:130px;
  border-radius:10px;background:#fff8f0;
  box-shadow:2px 2px 8px rgba(0,0,0,0.2);
}
.stamp img{width:100%;border-radius:8px;}
.stamp-number{font-size:14px;font-weight:bold;color:#b3561c;}
.stamp-date{font-size:12px;color:#8b5a2b;}
button{
  margin-top:6px;padding:6px 10px;
  font-size:14px;border-radius:6px;
  border:1px solid #c59f7b;
  background:#fff2e0;cursor:pointer;
}
button:hover{background:#ffd8b0;}
#stampCount{font-weight:bold;margin-top:10px;color:#b3561c;}
#jankenArea{
  margin-top:40px;padding:20px;
  border:3px dashed #c59f7b;
  border-radius:15px;background:#fff8f0;
}
#roulette{font-size:70px;height:90px;margin-bottom:10px;}
#jankenResult{font-size:18px;font-weight:bold;color:#b3561c;}
#adminStatus{color:#c0392b;font-weight:bold;margin-top:10px;}
/* オーバーレイ用 */
#stampOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.overlay-card{
  background:white;
  padding:40px 30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  position:relative;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
.stamp-icon{
  font-size:80px;
  margin:20px 0;
  opacity:0;
  transform:scale(0.3) rotate(-180deg);
}
@keyframes popStamp{
  0%{opacity:0; transform:scale(0.3) rotate(-180deg);}
  60%{transform:scale(1.3) rotate(10deg);}
  100%{opacity:1; transform:scale(1) rotate(0);}
}
/* 背景・ナビ */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #222;
  line-height: 1.7;
  scroll-behavior: smooth;
  background-image: url("https://bainarinoakaunto.github.io/iroiro-group-Project/%EF%BD%9A.png");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center center;
  background-attachment: fixed;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(200, 200, 200, 0.25);
  pointer-events: none;
  z-index: -1;
}
a { text-decoration: none; color: inherit; }
nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(255,255,255,0.95);
  border-bottom: 1px solid #eee;
  z-index: 100;
}
nav ul {
  display: flex;
  justify-content: center;
  list-style: none;
  margin: 0;
  padding: 16px;
  gap: 32px;
  flex-wrap: wrap;
}
</style>
</head>
<body>

<h1>デジスタ</h1>
<button onclick="enterAdmin()">管理者モード</button>
<div id="adminStatus"></div>

<div id="reader"></div>
<button onclick="restartScan()">再読み取り</button>

<p id="stampCount">合計スタンプ数: 0</p>
<div id="stampArea" class="stamp-area"></div>

<h2>じゃんけん（1日1回）</h2>
<div id="jankenArea">
  <div id="roulette">❓</div>
  <div>
    <button onclick="startJanken('rock')">✊</button>
    <button onclick="startJanken('scissors')">✌️</button>
    <button onclick="startJanken('paper')">✋</button>
  </div>
  <p id="jankenResult"></p>
</div>

<!-- スタンプオーバーレイ -->
<div id="stampOverlay" style="display:none;">
  <div class="overlay-card">
    <button id="closeBtn" onclick="closeOverlay()" style="float:right;background:#ccc;color:#000;">✖</button>
    <h2>🎉 スタンプ取得</h2>
    <div id="passwordArea" style="display:none;">
      <input type="password" id="passwordInput" placeholder="平日用パスワードを入力"><br>
      <button onclick="checkPassword()">送信</button>
    </div>
    <div class="stamp-icon" id="overlayIcon">🎫</div>
    <p id="overlayMessage">確認中...</p>
  </div>
</div>

<footer>
  <p>2026 いろいろ Group.<br>このサイトは実在する企業・団体とは無関係です。</p>
  <div class="footer-links">
    <a href="irotemu.html">新会社</a> |
    <a href="いろいろ通信.html">いろいろ通信</a> |
    <a href="情報掲載証明書.html">掲載証明</a> |
    <a href="デジタルスタンプカード.html">デジスタk</a> |
    <a href="いろいろ会社サービス.html">通貨管理</a>
  </div>
</footer>

<script>
/* ===== 管理者モード ===== */
const ADMIN_PASSWORD = "1430";
let isAdmin = false;
function enterAdmin(){
  if(prompt("管理者パスワード") === ADMIN_PASSWORD){
    isAdmin = true;
    document.getElementById("adminStatus").textContent = "👑 管理者モード中";
    alert("管理者モードになりました");
  }else{
    alert("パスワードが違います");
  }
}

/* ===== パスワード設定 ===== */
const USE_PASSWORD = "0430";             // スタンプ使用用
const WEEKDAY_STAMP_PASSWORD = "1234";   // 平日QR取得用

/* ===== 日付関連 ===== */
function today(){ const d=new Date(); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`; }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function isWeekday(){ const d=new Date().getDay(); return d>=1 && d<=5; }

/* ===== QR対応 ===== */
const QR_VALUE_INFO_MAP = {
  "https://codepen.io/bainarinoakaunto/pen/emZaZLr": { img:"https://bainarinoakaunto.github.io/iroiro-group-Project/%E3%81%84%E3%82%8D%E3%81%84%E3%82%8D.png", number:"001" },
  "https://bc.benesse.ne.jp/nzm/redirect?code=FsUPBNRukK": { img:"https://cdn2.scratch.mit.edu/get_image/project/1264832201_100x80.png", number:"002" },
  "https://maps.app.goo.gl/Fp1J9vefnib7n3AaA": { img:"https://cdn2.scratch.mit.edu/get_image/project/1261979082_100x80.png", number:"003" }
};
const JANKEN_STAMP={ img:"https://cdn2.scratch.mit.edu/get_image/project/1264832201_100x80.png", number:"じゃんけん" };
let stamps=JSON.parse(localStorage.getItem("stamps")||"[]");
let scanning=true;
let scanner;

/* ===== 表示更新 ===== */
function render(){
  const area=document.getElementById("stampArea");
  area.innerHTML="";
  document.getElementById("stampCount").textContent = "合計スタンプ数: "+stamps.filter(s=>!s.used).length;
  stamps.forEach((s,i)=>{
    if(s.used) return;
    area.insertAdjacentHTML("beforeend",`
      <div class="stamp">
        <img src="${s.img}">
        <div class="stamp-number">担当者No.${s.number}</div>
        <div class="stamp-date">取得日：${s.date}</div>
        <button onclick="useStamp(${i})">使用</button>
      </div>
    `);
  });
}

/* ===== スタンプ使用 ===== */
function useStamp(i){
  if(prompt("使用パスワード")===USE_PASSWORD){
    stamps[i].used=true;
    localStorage.setItem("stamps",JSON.stringify(stamps));
    render();
  } else alert("パスワードが違います");
}

/* ===== 平日パスワードチェック ===== */
function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  if(input === WEEKDAY_STAMP_PASSWORD){
    addStamp();
    document.getElementById("stampOverlay").style.display="none";
  } else alert("パスワードが違います");
}

/* ===== QRスキャン成功時 ===== */
function onScanSuccess(text){
  if(!scanning) return;
  const info=QR_VALUE_INFO_MAP[text];
  if(!info){alert("コードが違います");return;}
  stamps.push({img:info.img,number:info.number,date:today(),used:false});
  localStorage.setItem("stamps",JSON.stringify(stamps));
  render();
  scanning=false;
  scanner.clear();
}
function restartScan(){ if(scanning) return; scanning=true; scanner.render(onScanSuccess); }

/* ===== じゃんけん ===== */
const JANKEN_HANDS=[ {key:"rock",emoji:"✊"}, {key:"scissors",emoji:"✌️"}, {key:"paper",emoji:"✋"} ];
function startJanken(player){
  if(!isAdmin && localStorage.getItem("jankenDate")===todayKey()){ alert("今日はもうじゃんけんできません"); return; }
  let i=0;
  const timer=setInterval(()=>{ document.getElementById("roulette").textContent=JANKEN_HANDS[i++%3].emoji; },100);
  setTimeout(()=>{
    clearInterval(timer);
    const cpu=JANKEN_HANDS[Math.floor(Math.random()*3)];
    document.getElementById("roulette").textContent=cpu.emoji;
    const r=judge(player,cpu.key);
    document.getElementById("jankenResult").textContent="結果："+r;
    if(r!=="あいこ" && !isAdmin) localStorage.setItem("jankenDate",todayKey());
    if(r==="勝ち 🎉"){
      stamps.push({ img:JANKEN_STAMP.img, number:JANKEN_STAMP.number, date:today(), used:false });
      localStorage.setItem("stamps",JSON.stringify(stamps));
      render();
      alert("勝ち！スタンプを1個ゲット！");
    }
  },2000);
}
function judge(p,c){
  if(p===c) return "あいこ";
  if((p==="rock"&&c==="scissors")||(p==="scissors"&&c==="paper")||(p==="paper"&&c==="rock")) return "勝ち 🎉";
  return "負け 😢";
}

/* ===== カメラ起動 ===== */
scanner=new Html5QrcodeScanner("reader",{fps:8,qrbox:250},false);
scanner.render(onScanSuccess);
render();

/* ===== URLキー処理 ===== */
(function(){
  const params = new URLSearchParams(location.search);
  const key = params.get("key");
  if(!key) return;
  const validKey = "stamp-" + todayKey();
  if(key !== validKey) return;

  document.getElementById("stampOverlay").style.display = "flex";

  if(isWeekday()){
    document.getElementById("passwordArea").style.display = "block";
    document.getElementById("overlayMessage").textContent = "🔒 平日はパスワードが必要です";
  } else {
    addStamp();
  }
})();

/* ===== スタンプ追加共通関数 ===== */
function addStamp(){
  // デフォルトQR画像（例：休日や自動追加用）
  stamps.push({ img:"https://cdn2.scratch.mit.edu/get_image/project/1264832201_100x80.png", number:"自動", date:today(), used:false });
  localStorage.setItem("stamps",JSON.stringify(stamps));
  render();
}

/* ===== オーバーレイ閉じる ===== */
function closeOverlay(){
  document.getElementById("stampOverlay").style.display="none";
}
</script>
