<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>音声キーワード警報</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 20px;
  width: 420px;
  text-align: center;
  color: white;
}
input {
  width: 65%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
}
button {
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  margin-left: 5px;
  cursor: pointer;
}
.add-btn { background: #00c9a7; color: white; }
.start-btn {
  margin-top: 20px;
  width: 100%;
  background: #ffc75f;
  color: black;
}
.stop-btn {
  margin-top: 10px;
  width: 100%;
  background: #ff4d4d;
  color: white;
}
.tag {
  display: inline-flex;
  align-items: center;
  background: rgba(255,255,255,0.3);
  padding: 6px 12px;
  border-radius: 20px;
  margin: 5px;
}
.tag button {
  background: transparent;
  border: none;
  color: white;
  margin-left: 6px;
  cursor: pointer;
}
#spoken {
  margin-top: 20px;
  background: rgba(0,0,0,0.2);
  padding: 10px;
  border-radius: 10px;
  min-height: 40px;
}
#detected {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
  color: #ff4d4d;
}
</style>
</head>

<body>

<div class="card">
  <h1>🚨 音声キーワード警報</h1>

  <input type="text" id="keywordInput" placeholder="キーワードを入力">
  <button class="add-btn" onclick="addKeyword()">追加</button>

  <div id="keywords"></div>

  <button class="start-btn" onclick="startRecognition()">音声認識開始</button>
  <button class="stop-btn" onclick="stopRecognition()">停止</button>

  <div id="spoken">ここに話した内容が表示されます</div>
  <div id="detected"></div>
</div>

<script>
let keywords = [];
let recognition;
let cooldown = false;

const input = document.getElementById("keywordInput");
const alarm = new Audio("クイズ正解4.mp3");

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") addKeyword();
});

function addKeyword() {
  const word = input.value.trim();
  if (word && !keywords.includes(word)) {
    keywords.push(word);
    displayKeywords();
  }
  input.value = "";
}

function removeKeyword(word) {
  keywords = keywords.filter(k => k !== word);
  displayKeywords();
}

function displayKeywords() {
  const container = document.getElementById("keywords");
  container.innerHTML = "";
  keywords.forEach(word => {
    const span = document.createElement("span");
    span.className = "tag";
    span.innerHTML = `${word} <button onclick="removeKeyword('${word}')">✕</button>`;
    container.appendChild(span);
  });
}

function startRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("このブラウザは音声認識に対応していません。Chromeを使用してください。");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = function(event) {
    let transcript = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    document.getElementById("spoken").textContent = transcript;

    keywords.forEach(word => {
      if (!cooldown && transcript.includes(word)) {

        document.getElementById("detected").textContent = "🚨 検出: " + word;

        alarm.currentTime = 0;
        alarm.play();

        cooldown = true;
        setTimeout(() => cooldown = false, 3000);
      }
    });
  };

  recognition.onend = function() {
    recognition.start(); // 自動再開
  };

  recognition.start();
}

function stopRecognition() {
  if (recognition) {
    recognition.onend = null;
    recognition.stop();
  }
}
</script>

</body>
</html>
