<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>株シミュレーター26.1 | ページ移行のお知らせ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#f5f7f7;

    color:#222;

    min-height:100vh;

    display:flex;
    flex-direction:column;
}


/* =========================
   Header
========================= */

header{
    background:#006f68;

    color:white;

    padding:22px 25px;
}

.header-inner{
    max-width:1100px;

    margin:auto;

    font-weight:bold;

    font-size:20px;
}


/* =========================
   Main
========================= */

main{
    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;
}


/* =========================
   Migration Card
========================= */

.migration-card{

    width:100%;

    max-width:760px;

    background:white;

    border-radius:24px;

    padding:45px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.10);

    text-align:center;

    border-top:6px solid #006f68;

}


/* icon */

.icon{

    font-size:55px;

    margin-bottom:15px;

}


/* title */

h1{

    color:#006f68;

    font-size:34px;

    line-height:1.4;

    margin-bottom:20px;

}


/* text */

.message{

    color:#444;

    font-size:17px;

    line-height:1.9;

    margin-bottom:25px;

}


/* new page */

.new-page{

    background:#f0f8f7;

    border-radius:15px;

    padding:20px;

    margin:25px 0;

}


.new-page-title{

    color:#006f68;

    font-weight:bold;

    margin-bottom:8px;

}


.new-page-url{

    color:#555;

    font-size:14px;

    word-break:break-all;

}


/* button */

.migration-button{

    display:inline-block;

    margin-top:10px;

    padding:15px 30px;

    background:#006f68;

    color:white;

    text-decoration:none;

    border-radius:12px;

    font-weight:bold;

    font-size:16px;

    transition:.2s;

}


.migration-button:hover{

    background:#00524d;

    transform:translateY(-2px);

    box-shadow:
        0 7px 18px rgba(0,0,0,.15);

}


/* old page notice */

.note{

    margin-top:25px;

    color:#777;

    font-size:13px;

    line-height:1.7;

}


/* =========================
   Footer
========================= */

footer{

    text-align:center;

    padding:25px;

    color:#777;

    font-size:13px;

}


/* =========================
   Mobile
========================= */

@media(max-width:600px){

    header{

        padding:18px;

    }

    .header-inner{

        font-size:17px;

    }

    main{

        padding:25px 15px;

    }

    .migration-card{

        padding:30px 20px;

        border-radius:20px;

    }

    .icon{

        font-size:45px;

    }

    h1{

        font-size:26px;

    }

    .message{

        font-size:15px;

    }

    .migration-button{

        width:100%;

        padding:14px 15px;

    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

株シミュレーター26.1

</div>

</header>


<main>


<div class="migration-card">


<div class="icon">
🚀
</div>


<h1>
株シミュレーター26.1<br>
ページ移行のお知らせ
</h1>


<div class="message">

<p>
いつも株シミュレーター26.1をご利用いただき、
ありがとうございます。
</p>

<p>
このたび、株シミュレーター26.1は
<strong>新しいページへ移行しました。</strong>
</p>

</div>


<div class="new-page">

<div class="new-page-title">

新しい株シミュレーター26.1

</div>


<div class="new-page-url">

https://bainarinoakaunto.github.io/kabusimyureta/

</div>

</div>


<a
href="https://bainarinoakaunto.github.io/kabusimyureta/"
class="migration-button"
target="_blank"
rel="noopener">

新しいページへ移動

</a>


<div class="note">

※このページは旧ページです。<br>

今後は新しいページをご利用ください。<br>

ブックマークやお気に入りに登録されている場合は、
新しいページへの変更をお願いいたします。

</div>


</div>


</main>


<footer>

© BAINARI

</footer>


</body>

</html>
