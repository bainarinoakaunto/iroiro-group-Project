<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マーケットリンク集</title>
<style>
body{
  margin:0;
  background:#0d1117;
  font-family:Arial, sans-serif;
  color:#fff;
  text-align:center;
}

/* ===== ヘッダー ===== */
header{
  padding:40px 20px;
}
h1{
  color:#00ffcc;
  margin-bottom:10px;
}
.subtitle{
  color:#aaa;
  font-size:0.9em;
}

/* ===== NEWS表示 ===== */
.news-box{
  width:80%;
  margin:20px auto;
  padding:15px;
  background:#1c1f26;
  border-left:6px solid #00ffcc;
  border-radius:8px;
  font-size:1.1em;
  animation:fadeIn 1s ease-in-out;
}
.positive{border-left-color:#00ff66;}
.negative{border-left-color:#ff4444;}
.neutral{border-left-color:#00ffcc;}

/* ===== リンクカード ===== */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
  padding:40px 20px;
}
.card{
  background:#1c1f26;
  width:250px;
  padding:25px;
  border-radius:12px;
  transition:0.4s;
  box-shadow:0 0 15px rgba(0,255,204,0.1);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(0,255,204,0.4),transparent);
  transition:0.6s;
}
.card:hover::before{
  left:100%;
}
.card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 25px rgba(0,255,204,0.6);
}
.card a{
  text-decoration:none;
  color:#00ffcc;
  font-size:1.2em;
  display:block;
}

/* ===== アニメーション ===== */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}

footer{
  margin-top:50px;
  padding:20px;
  font-size:0.8em;
  color:#777;
}
</style>
</head>
<body>

<header>
  <h1>🌐 マーケットポータル</h1>
  <div class="subtitle">株シミュレーター総合ページ</div>
</header>

<!-- 🌍 最新NEWS表示 -->
<div id="latestNews" class="news-box">
  ニュースを取得中...
</div>

<!-- 🔗 リンク一覧 -->
<div class="container">

  <div class="card">
    <a href="preview.html">📈 株シミュレーター</a>
  </div>
  
  <div class="card">
    <a href="https://bainarinoakaunto.github.io/iroiro-group-Project/index.html" target="_blank">
      なんでも会社トップ
    </a>
  </div>
  
  <div class="card">
    <a href="link.html">🔗 リンク集</a>
  </div>

  <div class="card">
    <a href="https://finance.yahoo.co.jp" target="_blank">
      💹 Yahoo!ファイナンス
    </a>
  </div>

</div>



<script>
// ===== 最新ニュース自動取得 =====
const newsArea = document.getElementById("latestNews");
const latest = JSON.parse(localStorage.getItem("latestNews"));

if(latest){
  newsArea.innerText = "📰 " + latest.text + "（" + latest.sector + "）";
  newsArea.classList.add(latest.type);
}else{
  newsArea.innerText = "NEWSはありません";
}
</script>

</body>
</html>
