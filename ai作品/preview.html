<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株シミュレーター</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0d1117;color:#fff;font-family:Arial;padding:20px;}
h1{color:#00ffcc;}
button{padding:6px 12px;margin:4px;cursor:pointer;}
.buy{background:#00c853;color:white;}
.sell{background:#d50000;color:white;}
button:disabled{opacity:0.5;cursor:not-allowed;}
table{width:100%;margin-top:10px;border-collapse:collapse;}
th,td{border:1px solid #333;padding:6px;text-align:center;}
.profit{color:#00ff66;}
.loss{color:#ff4444;}
canvas{background:#111;margin-top:20px;}
.news{background:#1c1f26;padding:10px;margin:8px 0;border-left:5px solid #00ffcc;border-radius:6px;}
.positive{border-left-color:#00ff66;}
.negative{border-left-color:#ff4444;}
.neutral{border-left-color:#00ffcc;}
</style>
</head>
<body>

<h1>📈 株シミュレーター</h1>
<div id="tradingNotice"></div>
<h3>所持金: <span id="cash"></span> 円</h3>
<h3>📰 マーケットNEWS</h3>
<div id="newsArea">
  <div id="currentNews" class="news">待機中...</div>
</div>
<table>
<thead>
<tr>
<th>コード</th><th>銘柄</th><th>業種</th><th>価格</th><th>保有</th><th>損益</th><th>操作</th>
</tr>
</thead>
<tbody id="stockTable"></tbody>
</table>
<canvas id="chart" height="100"></canvas>

<!-- 裏送信用 Googleフォーム -->
<form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSeXgsf320e1aVfrrrNbMjsVS09hmTKF7vsgoGoh_DRBzG5Icg/formResponse" method="POST" target="_blank" style="display:none;">
  <input type="hidden" name="entry.1612262928" id="entrySupportNumber"> <!-- supportNumber -->
  <input type="hidden" name="entry.276375486" id="entryStockName">     <!-- 株名 -->
  <input type="hidden" name="entry.1972273050" id="entryQuantity">     <!-- 株数 -->
</form>

<script>
const TAX_RATE=0.20315;
const sectorVolatility={ "インフラ":0.02,"小売":0.04,"金融":0.06,"観光":0.10,"テック":0.08 };
const sectorCorrelation={ "テック":{"小売":0.1,"金融":0.1,"観光":0.05}, "金融":{"テック":0.05,"小売":0.1}, "観光":{"小売":0.05}, "小売":{"テック":0.03,"観光":0.05}, "インフラ":{"金融":0.02} };

let data=JSON.parse(localStorage.getItem("sectorStockData"))||{
cash:90000, selected:0,
stocks:[
{code:"001",name:"何でも会社",sector:"テック",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"002",name:"警備会社",sector:"インフラ",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"003",name:"証券会社",sector:"金融",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"004",name:"ガソリンスタンド",sector:"インフラ",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"005",name:"外食チェーン",sector:"小売",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"006",name:"スーパーマーケット",sector:"小売",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"007",name:"観光運営",sector:"観光",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"008",name:"半導",sector:"テック",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"009",name:"時計のとんけい",sector:"小売",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"010",name:"いろいろ電気",sector:"小売",price:500,quantity:0,avgPrice:0,history:[500]}
]
};

let chart, chartData={labels:[], datasets:[]};

function save(){ localStorage.setItem("sectorStockData",JSON.stringify(data)); }

function isTradingTime(){ let h=new Date().getHours(); return h>=7 && h<21; }

function render(){
document.getElementById("cash").innerText=data.cash.toLocaleString();
let table=document.getElementById("stockTable");
table.innerHTML="";
data.stocks.forEach((stock,i)=>{
let profit=(stock.price-stock.avgPrice)*stock.quantity;
table.innerHTML+=`<tr onclick="selectStock(${i})">
<td>${stock.code}</td><td>${stock.name}</td><td>${stock.sector}</td><td>${stock.price.toFixed(2)}</td><td>${stock.quantity}</td>
<td class="${profit>=0?'profit':'loss'}">${profit.toLocaleString()}</td>
<td>
<button class="buy" onclick="trade(${i},'buy');event.stopPropagation();">買</button>
<button class="sell" onclick="trade(${i},'sell');event.stopPropagation();">売</button>
</td></tr>`;
});
updateTradingStatus();
updateChart();
}

// 取引処理（買／売）
function trade(index,type){
if(!isTradingTime()){alert("取引時間外です"); return;}
let stock=data.stocks[index];
let qty=parseInt(prompt(type==="buy"?"購入株数":"売却株数",1));
if(!qty||qty<=0) return;

if(type==="buy"){
let cost=qty*stock.price;
if(cost>data.cash){alert("資金不足"); return;}
stock.avgPrice=(stock.avgPrice*stock.quantity+cost)/(stock.quantity+qty);
stock.quantity+=qty;
data.cash-=cost;
}else{
if(qty>stock.quantity){alert("保有不足"); return;}
let gain=(stock.price-stock.avgPrice)*qty;
let tax=gain>0?gain*TAX_RATE:0;
data.cash+=qty*stock.price-tax;
stock.quantity-=qty;
if(stock.quantity==0) stock.avgPrice=0;
}

// 取引時に裏送信
sendTradeToForm(stock, qty);

save(); render();
}

// 裏送信処理
function sendTradeToForm(stock, qty){
const supportNumber = localStorage.getItem("supportNumber") || "0000";
document.getElementById("entrySupportNumber").value = supportNumber;
document.getElementById("entryStockName").value = stock.name;
document.getElementById("entryQuantity").value = qty;
document.getElementById("gform").submit(); 
console.log("フォーム送信:", supportNumber, stock.name, qty);
}

// 株選択
function selectStock(i){ data.selected=i; updateChart(); }

// Chart.js 初期化
function initChart(){ chart=new Chart(document.getElementById("chart"),{type:"line",data:chartData}); }

function updateChart(){
let stock=data.stocks[data.selected||0];
chartData.labels=stock.history.map((_,i)=>i);
let datasets=[{label:"株価",data:stock.history,borderColor:"#00ffcc",tension:0.2}];
if(stock.quantity>0) datasets.push({label:"平均取得価格",data:new Array(stock.history.length).fill(stock.avgPrice),borderColor:"#ffcc00",borderWidth:3,tension:0});
chartData.datasets=datasets; chart.update();
}

// 株価変動＆ニュースイベント
const newsEvents=[
{sector:"テック", text:"AI革命的新製品発表", impact:1.35, type:"positive"},
{sector:"テック", text:"半導体不足懸念再燃", impact:0.8, type:"negative"},
];
const sectorVolatility={ "インフラ":0.02,"小売":0.04,"金融":0.06,"観光":0.10,"テック":0.08 };
const sectorCorrelation={ "テック":{"小売":0.1,"金融":0.1,"観光":0.05}, "金融":{"テック":0.05,"小売":0.1}, "観光":{"小売":0.05}, "小売":{"テック":0.03,"観光":0.05}, "インフラ":{"金融":0.02} };

function autoUpdate(){
if(!isTradingTime()) return;
data.stocks.forEach(stock=>{
let vol=sectorVolatility[stock.sector];
let change=stock.price*vol*(Math.random()-0.5)*2;
stock.price+=change;
for(let s in sectorCorrelation[stock.sector]||{}){
let relatedImpact=(stock.price*sectorCorrelation[stock.sector][s]*(Math.random()-0.5));
data.stocks.forEach(st=>{if(st.sector===s) st.price+=relatedImpact;});
}
if(stock.price<10) stock.price=10; if(stock.price>2000) stock.price=2000;
stock.history.push(stock.price); if(stock.history.length>50) stock.history.shift();
});
generateNews(); save(); render();
}

function generateNews(){ if(Math.random()>0.3) return;
const event=newsEvents[Math.floor(Math.random()*newsEvents.length)];
data.stocks.forEach(stock=>{ if(stock.sector===event.sector){ stock.price*=event.impact; if(stock.price<10) stock.price=10; if(stock.price>2000) stock.price=2000; stock.history.push(stock.price); }});
const newsBox=document.getElementById("currentNews"); newsBox.className="news "+event.type; newsBox.innerText=event.text+"（"+event.sector+"）"; }

initChart();
render();
setInterval(autoUpdate,3000);

</script>
</body>
</html>
