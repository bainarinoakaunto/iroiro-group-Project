<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株シミュレーター</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0d1117;color:#fff;font-family:Arial;padding:20px;}
h1{color:#00ffcc;}
button{padding:6px 12px;margin:4px;cursor:pointer;}
.buy{background:#00c853;color:white;}
.sell{background:#d50000;color:white;}
button:disabled{opacity:0.5;cursor:not-allowed;}
table{width:100%;margin-top:10px;border-collapse:collapse;}
th,td{border:1px solid #333;padding:6px;text-align:center;}
.profit{color:#00ff66;}
.loss{color:#ff4444;}
canvas{background:#111;margin-top:20px;}
#tradingNotice{text-align:center;font-size:1.5em;color:#ff4444;margin-bottom:20px;}

#newsArea{margin-bottom:20px;}
.news{
  background:#1c1f26;
  padding:10px;
  margin:8px 0;
  border-left:5px solid #00ffcc;
  border-radius:6px;
}
.positive{border-left-color:#00ff66;}
.negative{border-left-color:#ff4444;}
</style>
</head>
<body>

<h1>📈 株シミュレーター</h1>
<div id="tradingNotice"></div>

<h3>所持金: <span id="cash"></span> 円</h3>

<h3>📰 マーケットニュース</h3>
<div id="newsArea"></div>

<table>
<thead>
<tr>
<th>コード</th>
<th>銘柄</th>
<th>業種</th>
<th>価格</th>
<th>保有</th>
<th>損益</th>
</tr>
</thead>
<tbody id="stockTable"></tbody>
</table>

<canvas id="chart" height="100"></canvas>

<script>
const TAX_RATE=0.20315;

const sectorVolatility={
"インフラ":0.02,
"小売":0.04,
"金融":0.06,
"観光":0.10,
"テック":0.08
};

const newsEvents=[
{sector:"テック", text:"テック業界で革新的技術発表！", impact:1.3, type:"positive"},
{sector:"テック", text:"大型ハッキング被害発生", impact:0.7, type:"negative"},
{sector:"観光", text:"観光需要急回復！", impact:1.25, type:"positive"},
{sector:"金融", text:"金融不安拡大", impact:0.75, type:"negative"},
{sector:"小売", text:"消費拡大で売上増加期待", impact:1.2, type:"positive"},
{sector:"インフラ", text:"公共投資削減発表", impact:0.8, type:"negative"}
];

let data={
cash:90000,
selected:0,
stocks:[
{code:"001",name:"何でも会社",sector:"テック",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"002",name:"警備会社",sector:"インフラ",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"003",name:"証券会社",sector:"金融",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"004",name:"ガソリンスタンド",sector:"インフラ",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"005",name:"外食チェーン",sector:"小売",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"006",name:"スーパーマーケット",sector:"小売",price:500,quantity:0,avgPrice:0,history:[500]},
{code:"007",name:"観光運営",sector:"観光",price:500,quantity:0,avgPrice:0,history:[500]}
]
};

let chart;
let chartData={labels:[],datasets:[]};

function isTradingTime(){
let h=new Date().getHours();
return h>=7 && h<21;
}

function render(){
document.getElementById("cash").innerText=data.cash.toLocaleString();
let table=document.getElementById("stockTable");
table.innerHTML="";

data.stocks.forEach(stock=>{
let profit=(stock.price-stock.avgPrice)*stock.quantity;
table.innerHTML+=`
<tr>
<td>${stock.code}</td>
<td>${stock.name}</td>
<td>${stock.sector}</td>
<td>${isTradingTime()?stock.price.toFixed(2):"---"}</td>
<td>${stock.quantity}</td>
<td class="${profit>=0?'profit':'loss'}">${profit.toLocaleString()}</td>
</tr>`;
});
}

function updateChart(){
let stock=data.stocks[data.selected];
chartData.labels=stock.history.map((_,i)=>i);
chartData.datasets=[{
label:"株価",
data:stock.history,
borderColor:"#00ffcc",
tension:0.2
}];
chart.update();
}

function autoUpdate(){
if(!isTradingTime()) return;

data.stocks.forEach(stock=>{
let vol=sectorVolatility[stock.sector];
let change=stock.price*vol*(Math.random()-0.5)*2;
stock.price+=change;

/* ニュース影響 */
if(Math.random()<0.25){
let event=newsEvents[Math.floor(Math.random()*newsEvents.length)];
if(stock.sector===event.sector){
stock.price*=event.impact;

let newsArea=document.getElementById("newsArea");
let div=document.createElement("div");
div.className="news "+event.type;
div.innerText=event.text+"（"+event.sector+"）";
newsArea.prepend(div);
}
}

if(stock.price<10) stock.price=10;
if(stock.price>2000) stock.price=2000;

stock.history.push(stock.price);
if(stock.history.length>50) stock.history.shift();
});

render();
updateChart();
}

function initChart(){
chart=new Chart(document.getElementById("chart"),{
type:"line",
data:chartData
});
}

initChart();
render();
updateChart();
setInterval(autoUpdate,10000);
</script>

</body>
</html>
