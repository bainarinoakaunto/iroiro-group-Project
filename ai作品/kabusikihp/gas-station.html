<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ガソリンスタンド | 公式サイト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d1117;
  color:#fff;
}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(90deg,#ff3d00,#b71c1c);
  padding:30px;
  text-align:center;
  font-size:1.8em;
  font-weight:bold;
  letter-spacing:1px;
}

/* ===== ナビ ===== */
nav{
  background:#111827;
  padding:15px;
  text-align:center;
}
nav a{
  color:#ff5722;
  margin:0 20px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{
  color:white;
}

/* ===== ヒーロー ===== */
.hero{
  padding:60px 20px;
  text-align:center;
  background:linear-gradient(180deg,#1c1f26,#0d1117);
}
.hero h1{
  font-size:2.2em;
  margin-bottom:10px;
}
.hero p{
  color:#ccc;
  font-size:1.1em;
}

/* ===== セクション ===== */
.section{
  padding:50px 20px;
}
.card{
  background:#1c1f26;
  padding:30px;
  margin:20px auto;
  max-width:900px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(255,69,0,0.2);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(255,69,0,0.5);
}
.card h2{
  color:#ff7043;
}

/* ===== 価格ボード風 ===== */
.price-board{
  background:#000;
  padding:20px;
  border-radius:10px;
  text-align:center;
  font-size:1.3em;
  color:#00ff66;
  font-weight:bold;
}

/* ===== フッター ===== */
footer{
  background:#111827;
  text-align:center;
  padding:20px;
  color:#777;
  font-size:0.9em;
}
</style>
</head>

<body>

<header>
  ⛽ ガソリンスタンド
</header>

<nav>
  <a href="#about">会社概要</a>
  <a href="#service">サービス</a>
  <a href="#price">本日の価格</a>
  <a href="#contact">お問い合わせ</a>
</nav>

<div class="hero">
  <h1>エネルギーで未来を動かす</h1>
  <p>安全・安心・高品質な燃料を提供します</p>
</div>

<div class="section" id="about">
  <div class="card">
    <h2>会社概要</h2>
    <p>
      ガソリンスタンドは、地域密着型のエネルギー供給企業として
      全国展開を行っています。
    </p>
  </div>
</div>

<div class="section" id="service">
  <div class="card">
    <h2>主なサービス</h2>
    <ul>
      <li>レギュラー・ハイオク・軽油販売</li>
      <li>洗車サービス</li>
      <li>車検・整備</li>
      <li>カー用品販売</li>
    </ul>
  </div>
</div>

<div class="section" id="price">
  <div class="card">
    <h2>本日の価格</h2>
    <div class="price-board">
      レギュラー 168円 / L<br>
      ハイオク 178円 / L<br>
      軽油 152円 / L
    </div>
  </div>
</div>

<div class="section" id="contact">
  <div class="card">
    <h2>お問い合わせ</h2>
    <p>Email: info@gas-station.co.jp</p>
  </div>
</div>

<footer>
  実在する企業団体とは無関係です。.
</footer>

</body>
</html>
