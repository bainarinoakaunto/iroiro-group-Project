<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>証券会社 | 公式サイト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d1117;
  color:#fff;
}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(90deg,#b8860b,#5d4037);
  padding:30px;
  text-align:center;
  font-size:1.8em;
  font-weight:bold;
  letter-spacing:1px;
}

/* ===== ナビ ===== */
nav{
  background:#111827;
  padding:15px;
  text-align:center;
}
nav a{
  color:#ffd700;
  margin:0 20px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{
  color:white;
}

/* ===== ヒーロー ===== */
.hero{
  padding:60px 20px;
  text-align:center;
}
.hero h1{
  font-size:2.2em;
  margin-bottom:10px;
}
.hero p{
  color:#ccc;
  font-size:1.1em;
}

/* ===== セクション ===== */
.section{
  padding:50px 20px;
}
.card{
  background:#1c1f26;
  padding:30px;
  margin:20px auto;
  max-width:900px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(255,215,0,0.1);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(255,215,0,0.4);
}
.card h2{
  color:#ffd700;
}

/* ===== フッター ===== */
footer{
  background:#111827;
  text-align:center;
  padding:20px;
  color:#777;
  font-size:0.9em;
}
</style>
</head>

<body>

<header>
  💹 証券会社
</header>

<nav>
  <a href="#about">会社概要</a>
  <a href="#service">サービス</a>
  <a href="#ir">IR情報</a>
  <a href="#contact">お問い合わせ</a>
</nav>

<div class="hero">
  <h1>資産形成のパートナー</h1>
  <p>株式・債券・投資信託を通じて未来を支える</p>
</div>

<div class="section" id="about">
  <div class="card">
    <h2>会社概要</h2>
    <p>
      証券会社は、個人・法人向けに総合金融サービスを提供する
      資産運用の専門企業です。
    </p>
  </div>
</div>

<div class="section" id="service">
  <div class="card">
    <h2>主なサービス</h2>
    <ul>
      <li>株式取引サポート</li>
      <li>資産運用コンサルティング</li>
      <li>IPO支援</li>
      <li>海外投資サポート</li>
    </ul>
  </div>
</div>

<div class="section" id="ir">
  <div class="card">
    <h2>IR情報</h2>
    <p>決算資料・株主向け情報・財務データを公開しています。</p>
  </div>
</div>

<div class="section" id="contact">
  <div class="card">
    <h2>お問い合わせ</h2>
    <p>Email: info@shoken.co.jp</p>
  </div>
</div>

<footer>
  実在する企業団体とは無関係です。
</footer>

</body>
</html>
