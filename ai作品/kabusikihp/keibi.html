<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>警備会社 | 公式サイト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0d1117;
  color:#fff;
}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(90deg,#0d47a1,#001f54);
  padding:30px;
  text-align:center;
  font-size:1.8em;
  font-weight:bold;
  letter-spacing:1px;
}

/* ===== ナビ ===== */
nav{
  background:#111827;
  padding:15px;
  text-align:center;
}
nav a{
  color:#4fc3f7;
  margin:0 20px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{
  color:white;
}

/* ===== ヒーロー ===== */
.hero{
  padding:60px 20px;
  text-align:center;
}
.hero h1{
  font-size:2.2em;
  margin-bottom:10px;
}
.hero p{
  color:#aaa;
  font-size:1.1em;
}

/* ===== セクション ===== */
.section{
  padding:50px 20px;
}
.card{
  background:#1c1f26;
  padding:30px;
  margin:20px auto;
  max-width:900px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(33,150,243,0.1);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(33,150,243,0.4);
}
.card h2{
  color:#4fc3f7;
}

/* ===== フッター ===== */
footer{
  background:#111827;
  text-align:center;
  padding:20px;
  color:#777;
  font-size:0.9em;
}
</style>
</head>

<body>

<header>
  🛡 警備会社
</header>

<nav>
  <a href="#about">会社概要</a>
  <a href="#service">サービス</a>
  <a href="#ir">IR情報</a>
  <a href="#contact">お問い合わせ</a>
</nav>

<div class="hero">
  <h1>安心を守る、24時間体制</h1>
  <p>最新セキュリティ技術と人的警備で社会を支える</p>
</div>

<div class="section" id="about">
  <div class="card">
    <h2>会社概要</h2>
    <p>
      警備会社は、施設警備・機械警備・イベント警備を
      全国展開する総合セキュリティ企業です。
    </p>
  </div>
</div>

<div class="section" id="service">
  <div class="card">
    <h2>主なサービス</h2>
    <ul>
      <li>24時間施設警備</li>
      <li>防犯カメラ・監視システム導入</li>
      <li>イベント警備</li>
      <li>緊急対応サービス</li>
    </ul>
  </div>
</div>

<div class="section" id="ir">
  <div class="card">
    <h2>IR情報</h2>
    <p>決算資料・事業報告書・株主向け情報を掲載しています。</p>
  </div>
</div>

<div class="section" id="contact">
  <div class="card">
    <h2>お問い合わせ</h2>
    <p>Email: info@keibi.co.jp</p>
  </div>
</div>

<footer>
  実在する起業団体とは無関係です。
</footer>

</body>
</html>
