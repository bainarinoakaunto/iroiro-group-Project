<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>外食チェーン | 公式サイト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#fff8f0;
  color:#333;
}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(90deg,#ff5722,#ff9800);
  padding:30px;
  text-align:center;
  font-size:1.8em;
  font-weight:bold;
  color:white;
  letter-spacing:1px;
}

/* ===== ナビ ===== */
nav{
  background:#ff7043;
  padding:15px;
  text-align:center;
}
nav a{
  color:white;
  margin:0 20px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
nav a:hover{
  color:#ffe0b2;
}

/* ===== ヒーロー ===== */
.hero{
  padding:60px 20px;
  text-align:center;
  background:linear-gradient(180deg,#ffe0b2,#fff8f0);
}
.hero h1{
  font-size:2.2em;
  margin-bottom:10px;
}
.hero p{
  font-size:1.1em;
}

/* ===== セクション ===== */
.section{
  padding:50px 20px;
}
.card{
  background:white;
  padding:30px;
  margin:20px auto;
  max-width:900px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}
.card h2{
  color:#ff5722;
}

/* ===== メニュー表示 ===== */
.menu{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}
.menu-item{
  background:#fff3e0;
  padding:20px;
  width:250px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}
.menu-item:hover{
  transform:scale(1.05);
}
.price{
  font-weight:bold;
  color:#d84315;
  margin-top:10px;
}

/* ===== フッター ===== */
footer{
  background:#ff7043;
  text-align:center;
  padding:20px;
  color:white;
  font-size:0.9em;
}
</style>
</head>

<body>

<header>
  🍽 外食チェーン
</header>

<nav>
  <a href="#about">会社概要</a>
  <a href="#menu">メニュー</a>
  <a href="#campaign">キャンペーン</a>
  <a href="#contact">お問い合わせ</a>
</nav>

<div class="hero">
  <h1>おいしさで笑顔を届ける</h1>
  <p>全国展開の人気レストランチェーン</p>
</div>

<div class="section" id="about">
  <div class="card">
    <h2>会社概要</h2>
    <p>
      外食チェーンは、家族で楽しめる食事をテーマに
      全国で店舗展開しています。
    </p>
  </div>
</div>

<div class="section" id="menu">
  <div class="card">
    <h2>人気メニュー</h2>
    <div class="menu">
      <div class="menu-item">
        ハンバーグ定食
        <div class="price">¥980</div>
      </div>
      <div class="menu-item">
        とんかつセット
        <div class="price">¥1,080</div>
      </div>
      <div class="menu-item">
        パスタランチ
        <div class="price">¥890</div>
      </div>
    </div>
  </div>
</div>

<div class="section" id="campaign">
  <div class="card">
    <h2>キャンペーン</h2>
    <p>🎉 平日ランチ10%OFF 実施中！</p>
  </div>
</div>

<div class="section" id="contact">
  <div class="card">
    <h2>お問い合わせ</h2>
    <p>Email: info@restaurant</p>
  </div>
</div>

<footer>
  実在する企業団とは無関係です.
</footer>

</body>
</html>
