<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>会社検索</title>
<style>
body{font-family:Arial; text-align:center; background:#f5f5f5; padding:50px;}
h1{font-size:3em;}
input[type="text"]{width:50%; padding:10px; font-size:1.2em; border-radius:20px; border:1px solid #ccc;}
button{padding:10px 20px; font-size:1.2em; border:none; border-radius:20px; background:#4285f4; color:white; cursor:pointer;}
button:hover{background:#357ae8;}
#results{margin-top:30px; text-align:left; max-width:600px; margin-left:auto; margin-right:auto;}
.result-item{background:white; padding:15px; margin:10px 0; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.result-item a{text-decoration:none; color:#1a0dab; font-weight:bold;}
.result-item p{color:#555; margin-top:5px;}
</style>
</head>
<body>

<h1>会社検索</h1>
<input type="text" id="query" placeholder="検索ワードを入力">
<button onclick="search()">検索</button>

<div id="results"></div>

<script>
// 検索対象のリンク集
const sites = [
  {name:"なんでも会社", url:"https://bainarinoakaunto.github.io/iroiro-group-Project/index.html", description:"総合リンクページ"},
  {name:"警備会社", url:"keibi.html", description:"警備会社のホームページ"},
  {name:"ガソリンスタンド", url:"gas-station.html", description:"ガソリンスタンド情報"},
  {name:"証券会社", url:"shoken.html", description:"証券会社情報"},
  {name:"外食チェーン", url:"restaurant.html", description:"外食チェーン情報"},
  {name:"スーパーマーケット", url:"supermarket.html", description:"スーパーマーケット情報"},
  {name:"観光運営", url:"tourism.html", description:"観光関連ページ"}
];

function search(){
  const query = document.getElementById("query").value.toLowerCase();
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  if(!query) return;

  const results = sites.filter(site => site.name.toLowerCase().includes(query) || site.description.toLowerCase().includes(query));

  if(results.length===0){
    resultsDiv.innerHTML = "<p>検索結果はありません。</p>";
  } else {
    results.forEach(site=>{
      const div = document.createElement("div");
      div.className = "result-item";
      div.innerHTML = `<a href="${site.url}" target="_blank">${site.name}</a><p>${site.description}</p>`;
      resultsDiv.appendChild(div);
    });
  }
}
</script>

</body>
</html>
