<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>デジスタ | なんでも会社</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="icon" type="image/png" href="いろいろ.png">

<style>
body{
  font-family:"Comic Sans MS",sans-serif;
  text-align:center;
  padding:20px;
  background:#fdf2e9;
}

/* ===== スタンプ表示 ===== */
.stamp-area{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:15px;margin-top:20px;
}
.stamp{
  border:2px dashed #c59f7b;padding:5px;width:130px;
  border-radius:10px;background:#fff8f0;
}
.stamp img{width:100%;border-radius:8px;}
#stampCount{font-weight:bold;margin-top:10px;color:#b3561c;}

/* ===== オーバーレイ ===== */
#stampOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.overlay-card{
  background:white;
  padding:40px 30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
.stamp-icon{
  font-size:80px;
  margin:20px 0;
  opacity:0;
  transform:scale(0.3) rotate(-180deg);
}
@keyframes popStamp{
  0%{opacity:0; transform:scale(0.3) rotate(-180deg);}
  60%{transform:scale(1.3) rotate(10deg);}
  100%{opacity:1; transform:scale(1) rotate(0);}
}
button{
  margin-top:8px;
  padding:6px 14px;
  border-radius:6px;
  border:none;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}
button:hover{opacity:0.8;}
</style>
</head>

<body>

<h1>デジタルスタンプカード</h1>

<p id="stampCount">合計スタンプ数: 0</p>
<div id="stampArea" class="stamp-area"></div>

<!-- ===== スタンプ取得オーバーレイ ===== -->
<div id="stampOverlay">
  <div class="overlay-card">
    <h2>🎉 スタンプ取得</h2>

    <div id="passwordArea" style="display:none;">
      <input type="password" id="passwordInput" placeholder="パスワードを入力">
      <br>
      <button onclick="checkPassword()">送信</button>
    </div>

    <div class="stamp-icon" id="overlayIcon">🎫</div>
    <p id="overlayMessage">確認中...</p>
  </div>
</div>

<script>

/* ===== 設定 ===== */
const PASSWORD="111";

/* ===== スタンプ管理 ===== */
let stamps=JSON.parse(localStorage.getItem("stamps")||"[]");

function today(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}
function todayKey(){
  return new Date().toISOString().slice(0,10);
}

/* ===== 表示 ===== */
function render(){
  const area=document.getElementById("stampArea");
  area.innerHTML="";
  document.getElementById("stampCount").textContent=
    "合計スタンプ数: "+stamps.length;

  stamps.forEach(s=>{
    area.insertAdjacentHTML("beforeend",`
      <div class="stamp">
        <img src="${s.img}">
        <div>${s.date}</div>
      </div>
    `);
  });
}
render();

/* ===== URLキー判定 ===== */
(function(){

  const params=new URLSearchParams(location.search);
  const key=params.get("key");
  if(!key) return;

  const valid="stamp-"+todayKey();
  if(key!==valid) return;

  document.getElementById("stampOverlay").style.display="flex";

  if(isWeekday()){
    document.getElementById("passwordArea").style.display="block";
    document.getElementById("overlayMessage").textContent=
      "🔒 平日はパスワードが必要です";
  }else{
    addStamp();
  }

})();

/* ===== 平日判定 ===== */
function isWeekday(){
  const d=new Date().getDay();
  return (d>=1 && d<=5);
}

/* ===== パスワード確認 ===== */
function checkPassword(){
  if(document.getElementById("passwordInput").value===PASSWORD){
    document.getElementById("passwordArea").style.display="none";
    addStamp();
  }else{
    document.getElementById("overlayMessage").textContent=
      "パスワードが違います";
  }
}

/* ===== スタンプ追加 ===== */
function addStamp(){

  const already=stamps.find(s=>s.date===today());
  if(already){
    document.getElementById("overlayMessage").textContent=
      "今日は取得済みです";
    setTimeout(closeOverlay,2000);
    return;
  }

  stamps.push({
    img:"https://cdn2.scratch.mit.edu/get_image/project/1264832201_100x80.png",
    date:today()
  });

  localStorage.setItem("stamps",JSON.stringify(stamps));
  render();

  document.getElementById("overlayMessage").textContent=
    "スタンプ獲得！";

  const icon=document.getElementById("overlayIcon");
  icon.style.animation="popStamp 1s forwards";

  setTimeout(closeOverlay,3000);
}

function closeOverlay(){
  document.getElementById("stampOverlay").style.display="none";
}

</script>

</body>
</html>
