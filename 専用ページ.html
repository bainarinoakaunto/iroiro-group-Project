<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スタッフ専用ページ</title>
<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding:20px;
  background:#fdf2e9;
}
.stamp-area{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}
.stamp{
  border:2px dashed #c59f7b;
  padding:5px;
  width:130px;
  border-radius:10px;
  background:#fff8f0;
}
.stamp img{
  width:100%;
  border-radius:8px;
}
button{
  margin-top:10px;
  padding:8px 14px;
}
#stampCount{
  font-weight:bold;
  margin-top:10px;
}
</style>

<script>
// 🔐 ログインチェック
if(sessionStorage.getItem("auth") !== "ok"){
  alert("スタッフログインを通ってください");
  location.href = "スタッフログイン.html"; // ログインページに戻す
}
</script>
</head>

<body>

<h1>🎫 スタッフ専用ページ</h1>

<p id="stampCount">合計スタンプ数: 0</p>

<button onclick="manualStamp()">🎫 スタンプを押す</button>

<div id="stampArea" class="stamp-area"></div>

<script>
// スタンプデータ（localStorageで保存）
let stamps = JSON.parse(localStorage.getItem("stamps") || "[]");

// 今日の日付取得
function today(){
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

// 画面更新
function render(){
  const area = document.getElementById("stampArea");
  area.innerHTML = "";
  document.getElementById("stampCount").textContent = "合計スタンプ数: " + stamps.length;
  stamps.forEach((s)=>{
    area.insertAdjacentHTML("beforeend",`
      <div class="stamp">
        <img src="${s.img}">
        <div>取得日：${s.date}</div>
      </div>
    `);
  });
}

// スタンプ手動追加
function manualStamp(){
  stamps.push({
    img:"https://cdn2.scratch.mit.edu/get_image/project/1264832201_100x80.png",
    date:today()
  });
  localStorage.setItem("stamps", JSON.stringify(stamps));
  render();
  alert("スタンプを追加しました！");
}

render();
</script>

</body>
</html>
