<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini OBS - TV表示</title>
<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

#screen-container {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  overflow:hidden;
}

#screen {
  object-fit:contain; /* 縦横比維持 */
  max-width:100%;
  max-height:100%;
}

/* スライダーUI */
#controls {
  padding:5px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
}
#sizeSlider {
  flex:1;
}
</style>
</head>
<body>

<div id="screen-container">
  <img id="screen">
</div>

<div id="controls">
  <label>サイズ調整:</label>
  <input type="range" id="sizeSlider" min="10" max="200" value="100">
  <span id="sizeValue">100%</span>
</div>

<script>
// BroadcastChannelでリアルタイム受信
const img = document.getElementById("screen");
const channel = new BroadcastChannel("tv-share");

channel.onmessage = e => {
  img.src = URL.createObjectURL(e.data);
};

// スライダーでサイズ調整
const slider = document.getElementById("sizeSlider");
const sizeValue = document.getElementById("sizeValue");

slider.oninput = () => {
  const scale = slider.value / 100;
  img.style.width = scale * 100 + "%";
  img.style.height = "auto"; // 縦横比維持
  sizeValue.textContent = slider.value + "%";
};

// フルスクリーン化
function fullscreen() {
  if(!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}
window.onload = fullscreen;
document.addEventListener("click", fullscreen);
</script>
</body>
</html>
