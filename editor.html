<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mi!-共有</title>
<style>
body {
  margin:0; padding:0;
  font-family:sans-serif;
  background:#111;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h2 { margin:10px 0; }

#controls {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:10px;
  align-items:center;
}

button, input[type="range"], input[type="file"] {
  padding:5px;
  cursor:pointer;
}

#screen-container {
  position:relative;
  width:80vw;
  height:50vh;
  background:black;
  overflow:hidden;
  border:2px solid #555;
}

#screen {
  object-fit:contain;
  width:100%;
  height:100%;
}

img.draggable {
  position:absolute;
  cursor:move;
  user-select:none;
  touch-action:none;
}
</style>
</head>
<body>

<h2>Mini OBS 統合ページ</h2>

<div id="controls">
  <!-- 画面共有 -->
  <button id="startShare">画面共有開始</button>

  <!-- 受信 -->
  <button id="startReceive">画面共有受信</button>
  <label>受信画像サイズ:</label>
  <input type="range" id="receiveSize" min="10" max="200" value="100">
  <span id="receiveSizeValue">100%</span>

  <!-- 画像合成 -->
  <input type="file" id="uploadImg" multiple accept="image/*">
  <button id="bringFront">前面へ</button>
  <button id="sendBack">背面へ</button>
  <button id="deleteImg">削除</button>
  <label>サイズ調整:</label>
  <input type="range" id="imgSize" min="10" max="200" value="100">
  <span id="imgSizeValue">100%</span>
</div>

<div id="screen-container">
  <video id="preview" autoplay muted style="display:none;"></video>
  <img id="screen" style="display:none;">
</div>

<script>
// ---------- 画面共有側 ----------
const startShare = document.getElementById("startShare");
const preview = document.getElementById("preview");

let shareChannel;

startShare.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({video:true});
    preview.srcObject = stream;
    preview.style.display = "block";

    const track = stream.getVideoTracks()[0];
    const imageCapture = new ImageCapture(track);

    shareChannel = new BroadcastChannel("tv-share");

    setInterval(async () => {
      const bitmap = await imageCapture.grabFrame();
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap,0,0);
      canvas.toBlob(blob => { shareChannel.postMessage(blob); }, "image/jpeg", 0.7);
    }, 33);
    startShare.disabled = true;
    startShare.textContent = "共有中…";
  } catch(e) {
    alert("画面共有に失敗: "+e);
  }
};

// ---------- 受信側 ----------
const startReceive = document.getElementById("startReceive");
const screen = document.getElementById("screen");
const receiveSize = document.getElementById("receiveSize");
const receiveSizeValue = document.getElementById("receiveSizeValue");

let receiveChannel;

startReceive.onclick = () => {
  receiveChannel = new BroadcastChannel("tv-share");
  receiveChannel.onmessage = e => {
    screen.src = URL.createObjectURL(e.data);
    screen.style.display = "block";
  };
  startReceive.disabled = true;
  startReceive.textContent = "受信中…";
};

// サイズ調整
receiveSize.oninput = () => {
  screen.style.width = receiveSize.value + "%";
  receiveSizeValue.textContent = receiveSize.value + "%";
};

// ---------- 画像合成 ----------
const uploadImg = document.getElementById("uploadImg");
const container = document.getElementById("screen-container");
const imgSize = document.getElementById("imgSize");
const imgSizeValue = document.getElementById("imgSizeValue");
const bringFront = document.getElementById("bringFront");
const sendBack = document.getElementById("sendBack");
const deleteImg = document.getElementById("deleteImg");

let selectedImg = null;

uploadImg.addEventListener("change", e => {
  for(const file of e.target.files){
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.classList.add("draggable");
    img.style.width="100%";  // デフォルトで親の100%幅に設定
    img.style.top="0px";
    img.style.left="0px";

    img.addEventListener("click", ev=>{
      ev.stopPropagation();
      selectedImg = img;
      imgSize.value = parseInt(img.style.width); // ここは変更後の%に合わせて調整
      imgSizeValue.textContent = imgSize.value + "%";
    });

    // ドラッグ
    let offsetX, offsetY;
    img.addEventListener("pointerdown", e=>{
      selectedImg = img;
      offsetX = e.clientX - img.offsetLeft;
      offsetY = e.clientY - img.offsetTop;
      img.setPointerCapture(e.pointerId);
    });
    img.addEventListener("pointermove", e=>{
      if(e.pressure === 0) return;
      img.style.left = e.clientX - offsetX + "px";
      img.style.top = e.clientY - offsetY + "px";
    });

    container.appendChild(img);
  }
});

container.addEventListener("click", ()=>{ selectedImg = null; });

// サイズ調整
imgSize.addEventListener("input", ()=>{
  if(selectedImg){
    const containerWidth = container.offsetWidth;  // コンテナの幅を取得
    const newWidth = (imgSize.value / 100) * containerWidth;  // 親コンテナに対する割合で幅を設定
    selectedImg.style.width = newWidth + "px";  // 計算されたピクセル数に変更
    imgSizeValue.textContent = imgSize.value + "%";
  }
});

// 前面に持ってくる
bringFront.addEventListener("click", ()=>{
  if(selectedImg) {
    selectedImg.style.zIndex = 10; // 前面へ
  }
});

// 背面に送る
sendBack.addEventListener("click", ()=>{
  if(selectedImg) {
    selectedImg.style.zIndex = -10; // 背面へ
  }
});

// 画像削除
deleteImg.addEventListener("click", ()=>{
  if(selectedImg) {
    selectedImg.remove();
    selectedImg = null;
  }
});
</script>

</body>
</html>
