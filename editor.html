<style>
body {

  background:#111;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h2 { margin:10px 0; }

#controls {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:10px;
  align-items:center;
}

button, input[type="range"], input[type="file"] {
  padding:5px;
  cursor:pointer;
}

#screen-container {
  position:relative;
  width:100vw;  /* 画面サイズに合わせる */
  height:100vh; /* 画面サイズに合わせる */
  background:black;
  overflow:hidden;
  border:2px solid #555;
}

#screen {
  object-fit:contain;  /* 縦横比を維持 */
  width:100%;
  height:100%;
  background:black;   /* 余白を黒で埋める */
}

img.draggable {
  position:absolute;
  cursor:move;
  user-select:none;
  touch-action:none;
}
</style>
</head>
<body>

<h2>Mi！エディタ</h2>

<div id="controls">
  <!-- 画面共有 -->
  <button id="startShare">画面共有開始</button>

  <!-- 受信 -->
  <button id="startReceive">画面共有受信</button>
  <label>受信画像サイズ:</label>
  <input type="range" id="receiveSize" min="10" max="200" value="100">
  <span id="receiveSizeValue">100%</span>

  <!-- 画像合成 -->
  <input type="file" id="uploadImg" multiple accept="image/*">
  <button id="bringFront">前面へ</button>
  <button id="sendBack">背面へ</button>
  <button id="deleteImg">削除</button>
  <label>サイズ調整:</label>
  <input type="range" id="imgSize" min="10" max="200" value="100">
  <span id="imgSizeValue">100%</span>
</div>

<div id="screen-container">
  <video id="preview" autoplay muted style="display:none;"></video>
  <img id="screen" style="display:none;">
</div>

// ---------- 画面共有側 ----------
const startShare = document.getElementById("startShare");
const preview = document.getElementById("preview");

let shareChannel;

startShare.onclick = async () => {
  try {
    // 画面共有の開始
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true  // 音声も共有する場合
    });
    preview.srcObject = stream;
    preview.style.display = "block";

    // 画面キャプチャの設定
    const track = stream.getVideoTracks()[0];
    const imageCapture = new ImageCapture(track);

    // BroadcastChannelの設定
    shareChannel = new BroadcastChannel("tv-share");

    // 画面のキャプチャを定期的に行い、送信
    setInterval(async () => {
      const bitmap = await imageCapture.grabFrame();
      const canvas = document.createElement("canvas");

      // 画面サイズに合わせる
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, window.innerWidth, window.innerHeight);  // 画面のサイズにリサイズ
      canvas.toBlob(blob => {
        shareChannel.postMessage(blob);  // 画面データを送信
      }, "image/jpeg", 0.7);  // JPEG圧縮
    }, 33);  // 約30fpsで送信

    // 画面共有中のUI変更
    startShare.disabled = true;
    startShare.textContent = "共有中…";
  } catch (e) {
    console.error("画面共有に失敗: ", e);
    alert("画面共有に失敗: " + e.message);
  }
};
