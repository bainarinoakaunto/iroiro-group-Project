<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像合成エディタ</title>
<style>
body {
  margin:0;
  padding:0;
  background:#222;
  color:white;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#canvas-container {
  position:relative;
  width:80vw;
  height:60vh;
  background:#444;
  margin-top:20px;
  overflow:hidden;
  border:2px solid #888;
}

img.draggable {
  position:absolute;
  cursor:move;
  user-select:none;
  touch-action: none;
}

#controls {
  margin-top:10px;
  display:flex;
  gap:10px;
  align-items:center;
}
</style>
</head>
<body>

<h2>画像合成エディタ</h2>

<input type="file" id="fileInput" multiple accept="image/*">

<div id="canvas-container"></div>

<div id="controls">
  <label>選択画像のサイズ:</label>
  <input type="range" id="sizeSlider" min="10" max="300" value="100">
  <span id="sizeValue">100%</span>
</div>

<script>
const container = document.getElementById("canvas-container");
const fileInput = document.getElementById("fileInput");
const sizeSlider = document.getElementById("sizeSlider");
const sizeValue = document.getElementById("sizeValue");

let selectedImg = null;

// ファイルアップロード
fileInput.addEventListener("change", e => {
  for (const file of e.target.files) {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.classList.add("draggable");
    img.style.width = "100px";
    img.style.top = "0px";
    img.style.left = "0px";

    // クリックで選択
    img.addEventListener("click", () => {
      selectedImg = img;
      sizeSlider.value = parseInt(img.style.width);
      sizeValue.textContent = sizeSlider.value + "px";
    });

    // ドラッグで移動
    let offsetX, offsetY;
    img.addEventListener("pointerdown", e => {
      selectedImg = img;
      offsetX = e.clientX - img.offsetLeft;
      offsetY = e.clientY - img.offsetTop;
      img.setPointerCapture(e.pointerId);
    });
    img.addEventListener("pointermove", e => {
      if (e.pressure === 0) return; // 押されてないとき
      img.style.left = e.clientX - offsetX + "px";
      img.style.top = e.clientY - offsetY + "px";
    });

    container.appendChild(img);
  }
});

// サイズスライダーで調整
sizeSlider.addEventListener("input", () => {
  if (selectedImg) {
    selectedImg.style.width = sizeSlider.value + "px";
    sizeValue.textContent = sizeSlider.value + "px";
  }
});
</script>

</body>
</html>
