<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mi！ - 操作用</title>
<style>
body { font-family: sans-serif; }
canvas { border:1px solid #000; display:block; margin-top:10px; }
ul { list-style:none; padding:0; }
li { margin:4px 0; }
li button { margin-left:10px; }
</style>
</head>
<body>

<h2>Mi！ - 操作用</h2>

<button id="start">画面取得</button>
<button id="openTV">TV表示</button>
<input type="file" id="addImg" multiple accept="image/*">

<h3>登録画像</h3>
<ul id="imgList"></ul>

<canvas id="canvas" width="1280" height="720"></canvas>

<script>
/* -------------------
   1. 初期設定
------------------- */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const channel = new BroadcastChannel("tv-share");
let video = document.createElement("video"); 
video.autoplay = true;
let sources = [];
let active = null, ox = 0, oy = 0;
let idCounter = 0;

/* -------------------
   2. 画面取得
------------------- */
document.getElementById("start").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video:{ cursor:"always" } });
    video.srcObject = stream;
    draw();
  } catch(err) {
    alert("画面取得に失敗しました:\n" + err.message);
    console.error(err);
  }
};

/* -------------------
   3. TV表示ボタン
------------------- */
document.getElementById("openTV").onclick = () => {
  window.open("viewer.html", "_blank");
};

/* -------------------
   4. 画像アップロード
------------------- */
document.getElementById("addImg").onchange = e => {
  const files = e.target.files;
  for (let file of files) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    const id = idCounter++;
    img.onload = () => {
      const source = { img, x:100, y:100, w:img.width/2, h:img.height/2, id };
      sources.push(source);
      addImageList(source);
    };
  }
};

function addImageList(source){
  const ul = document.getElementById("imgList");
  const li = document.createElement("li");
  li.id = "img-" + source.id;
  li.textContent = "画像 " + source.id;
  const btn = document.createElement("button");
  btn.textContent = "削除";
  btn.onclick = () => {
    sources = sources.filter(s=>s.id!==source.id);
    ul.removeChild(li);
  };
  li.appendChild(btn);
  ul.appendChild(li);
}

/* -------------------
   5. 描画ループ
------------------- */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(video.srcObject) ctx.drawImage(video,0,0,canvas.width,canvas.height);
  for(const s of sources) ctx.drawImage(s.img,s.x,s.y,s.w,s.h);
  canvas.toBlob(b => channel.postMessage(b), "image/webp", 0.7);
  requestAnimationFrame(draw);
}

/* -------------------
   6. ドラッグ移動
------------------- */
canvas.onmousedown = e=>{
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  for(let i = sources.length-1; i>=0; i--){
    const s = sources[i];
    if(x>s.x && x<s.x+s.w && y>s.y && y<s.y+s.h){
      active = s;
      ox = x - s.x;
      oy = y - s.y;
      sources.splice(i,1);
      sources.push(s);
      break;
    }
  }
};

canvas.onmousemove = e=>{
  if(!active) return;
  const r = canvas.getBoundingClientRect();
  active.x = e.clientX - r.left - ox;
  active.y = e.clientY - r.top - oy;
};
canvas.onmouseup = canvas.onmouseleave = ()=> active=null;
</script>
</body>
</html>
